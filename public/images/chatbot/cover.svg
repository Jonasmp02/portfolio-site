<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Chat window with questions and answers about Jonas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="user" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <circle cx="560" cy="60" r="120" fill="#0ea5e9" opacity="0.18"/>

  <!-- Chat window -->
  <rect x="150" y="40" width="340" height="320" rx="24" fill="#ffffff"/>
  <path d="M150 64 Q150 40 174 40 H466 Q490 40 490 64 V96 H150 Z" fill="url(#user)"/>
  <circle cx="186" cy="68" r="15" fill="#ffffff" opacity="0.2"/>
  <rect x="179" y="62" width="14" height="11" rx="3" fill="#ffffff"/>
  <rect x="212" y="58" width="96" height="9" rx="4.5" fill="#ffffff"/>
  <rect x="212" y="72" width="60" height="7" rx="3.5" fill="#bae6fd"/>

  <rect x="150" y="96" width="340" height="216" fill="#f0f9ff"/>
  <!-- Assistant bubble -->
  <rect x="170" y="114" width="200" height="44" rx="14" fill="#ffffff"/>
  <rect x="184" y="127" width="160" height="7" rx="3.5" fill="#94a3b8"/>
  <rect x="184" y="140" width="110" height="7" rx="3.5" fill="#cbd5e1"/>
  <!-- User bubble -->
  <rect x="290" y="172" width="180" height="34" rx="14" fill="url(#user)"/>
  <rect x="306" y="185" width="140" height="7" rx="3.5" fill="#e0f2fe"/>
  <!-- Assistant bubble -->
  <rect x="170" y="220" width="230" height="58" rx="14" fill="#ffffff"/>
  <rect x="184" y="233" width="190" height="7" rx="3.5" fill="#94a3b8"/>
  <rect x="184" y="246" width="170" height="7" rx="3.5" fill="#94a3b8"/>
  <rect x="184" y="259" width="120" height="7" rx="3.5" fill="#cbd5e1"/>
  <!-- Typing dots -->
  <circle cx="186" cy="296" r="4" fill="#38bdf8"/>
  <circle cx="200" cy="296" r="4" fill="#38bdf8" opacity="0.7"/>
  <circle cx="214" cy="296" r="4" fill="#38bdf8" opacity="0.4"/>

  <!-- Input -->
  <rect x="166" y="322" width="262" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="452" cy="335" r="14" fill="url(#user)"/>
  <path d="M446 335 L458 329 L454 335 L458 341 Z" fill="#ffffff"/>

  <!-- Shield to hint at the security work -->
  <g transform="translate(500 250)">
    <path d="M40 0 L76 14 V44 Q76 76 40 92 Q4 76 4 44 V14 Z" fill="#0ea5e9"/>
    <path d="M24 46 L36 58 L58 34" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
